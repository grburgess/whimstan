[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "whimstan"
description = "Hierarchical Bayesian search for the Warm-Hot Intergalactic Medium in Swift-XRT GRB afterglows."
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [{ name = "J. Michael Burgess", email = "jmichaelburgess@gmail.com" }]
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "jax>=0.4.30,<0.5",
  "numpyro>=0.15,<0.18",
  "arviz>=0.18,<0.22",
  "jaxspec>=0.1,<0.3",
  "h5py>=3.10,<4",
  "astropy>=6.0,<8",
  "healpy>=1.17,<2",
  "gdpyc>=1.0,<2",
  "setuptools>=68,<81",  # gdpyc 1.x still uses pkg_resources, removed in setuptools 81
  "omegaconf>=2.3,<3",
  "rich>=13.7,<15",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.scripts]
whimstan = "whimstan.cli:main"

[project.urls]
"Source" = "https://github.com/grburgess/whimstan"
"Issues" = "https://github.com/grburgess/whimstan/issues"

[tool.hatch.version]
path = "whimstan/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["whimstan"]

[tool.hatch.build.targets.sdist]
include = ["whimstan/", "tests/", "docs/", "tools/", "README.md", "LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
  "whimstan/_version.py",
  "external",
  "docs/conf.py",
  "docs/notebooks",
]

[tool.ruff.lint]
select = [
  "E", "F", "W",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
  "NPY",
  "PD",
  "PT",
]
ignore = [
  "E501",
  "B008",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PT011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["whimstan/_version.py", "tests/", "docs/"]
plugins = []

[[tool.mypy.overrides]]
module = ["jax.*", "jaxspec.*", "healpy.*", "gdpyc.*", "h5py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
markers = [
  "slow: tests that take more than 10 seconds (run nightly only)",
  "needs_grid: tests requiring the WHIM opacity grid release asset",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:jax.*",
]

[tool.coverage.run]
source = ["whimstan"]
omit = ["whimstan/_version.py", "whimstan/cli.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
