exclude: |
  (?x)^(
    tests/fixtures/.*|
    external/.*|
    docs/_static/.*|
    docs/_templates/.*|
    docs/media/.*|
    docs/api/.*|
    docs/md/.*|
    docs/notebooks/.*|
    docs/conf\.py|
    docs/index\.rst|
    docs/requirements\.txt
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=8000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - "numpy>=1.26"
          - "types-PyYAML"
          - "rich>=13.7,<15"
        args: ["--config-file=pyproject.toml"]
        files: ^whimstan/
